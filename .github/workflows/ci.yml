name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 native-terminal.test.py
      - run: python3 native-cancellation.test.py
      - run: node cli.js --help
      - run: mkdir -p dist
      - run: npm pack --workspace view-latex-md-math --pack-destination dist
      - run: npm pack --pack-destination dist
